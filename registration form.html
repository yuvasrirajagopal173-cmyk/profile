<!DOCTYPE html>
<html>
<head>
    <title>Job Registration Form</title>
</head>
<body>

    <center>
        <h2>Job Registration Form</h2>

        <form>

            <table cellpadding="8">

                <tr>
                    <td><label>Full Name:</label></td>
                    <td><input type="text" name="name" placeholder="Enter your name" required></td>
                </tr>

                <tr>
                    <td><label>Email:</label></td>
                    <td><input type="email" name="email" placeholder="Enter your email" required></td>
                </tr>

                <tr>
                    <td><label>Phone Number:</label></td>
                    <td><input type="tel" name="phone" placeholder="Enter your phone number" required></td>
                </tr>

                <tr>
                    <td><label>Qualification:</label></td>
                    <td>
                        <select name="qualification" required>
                            <option value="">--Select--</option>
                            <option>B.E</option>
                            <option>B.Tech</option>
                            <option>B.Sc</option>
                            <option>BCA</option>
                            <option>MCA</option>
                            <option>M.Sc</option>
                            <option>M.E</option>
                            <option>Other</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td><label>Gender:</label></td>
                    <td>
                        <input type="radio" name="gender" value="Male"> Male
                        <input type="radio" name="gender" value="Female"> Female
                        <input type="radio" name="gender" value="Other"> Other
                    </td>
                </tr>

                <tr>
                    <td><label>Technical Skills:</label></td>
                    <td>
                        <input type="checkbox" name="skill" value="HTML"> HTML
                        <input type="checkbox" name="skill" value="CSS"> CSS
                        <input type="checkbox" name="skill" value="JavaScript"> JavaScript
                        <br>
                        <input type="checkbox" name="skill" value="Python"> Python
                        <input type="checkbox" name="skill" value="SQL"> SQL
                        <input type="checkbox" name="skill" value="Power BI"> Power BI
                    </td>
                </tr>

                <tr>
                    <td><label>Preferred Location:</label></td>
                    <td>
                        <select name="location">
                            <option value="">--Select Location--</option>
                            <option>Chennai</option>
                            <option>Bangalore</option>
                            <option>Hyderabad</option>
                            <option>Pune</option>
                            <option>Mumbai</option>
                            <option>Coimbatore</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td><label>Upload Resume:</label></td>
                    <td>
                        <input type="file" name="resume">
                    </td>
                </tr>

                <tr>
                    <td><label>Address:</label></td>
                    <td>
                        <textarea name="address" rows="5" cols="30" placeholder="Enter your address"></textarea>
                    </td>
                </tr>

                <tr>
                    <td colspan="2" align="center">
                        <input type="submit" value="Submit">
                        <input type="reset" value="Reset">
                    </td>
                </tr>

            </table>

        </form>

    </center>

</body>
</html>
